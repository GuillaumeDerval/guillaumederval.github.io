name: Build CV PDF

on:
  push:
    paths:
      - 'cv_source/**'
      - '_data/publications/**'
      - '.github/workflows/build_cv.yml'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Compile CV
        run: |
          typst compile --root . --font-path cv_source/fonts cv_source/cv.typ files/CV.pdf

      - name: Commit updated PDF
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/CV.pdf
          git commit -m "Automated update of CV.pdf" || echo "No changes to commit"
          git push
